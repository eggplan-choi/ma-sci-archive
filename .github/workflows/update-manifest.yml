name: Auto Update Manifest

# 마크다운(.md), HTML(.html) 파일이나 파이썬 스크립트가 수정되어 'main' 브랜치에 푸시될 때만 작동합니다.
on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '**/*.html'
      - 'generate_manifest.py'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN이 레포지토리에 커밋할 수 있도록 쓰기 권한 부여
    permissions:
      contents: write

    steps:
      - name: 📥 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: ⚙️ manifest.json 생성 스크립트 실행
        run: python generate_manifest.py

      - name: 📤 변경사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          
          # 변경사항이 있을 경우에만 커밋하고 푸시 (에러 방지)
          git diff --staged --quiet || (git commit -m "chore: 마크다운 업데이트에 따른 manifest.json 자동 갱신" && git push)
